[project]
name = "ilp4lid"
version = "1.0.0"
description = "ILP4LID: sentence-level code-switching language identification on 125 labels"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Joanna Radoła"}
]
requires-python = ">=3.10"
dependencies = ["fasttext-wheel==0.9.2",        
    "numpy<2",                      # fasttext 0.9.2 predict() breaks under numpy 2
    "pyomo>=6.7",
    "highspy>=1.7",                 # HiGHS solver -> allows solver_name="appsi_highs"
    "pandas",
    "tqdm",
    "huggingface_hub"               # model download (LiteLID)
    ]

[project.scripts]
ilp4lid-demo = "ilp4lid.demo:main"
ilp4lid-batch = "ilp4lid.batch:main"

[project.optional-dependencies]
mpi = ["mpi4py"] # for parallelisation
gurobi = ["gurobipy"] # to use solver_name="gurobi"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.urls]
Homepage = "https://github.com/jradola/ILP4LID"
Model = "https://huggingface.co/paruwka/LiteLID"

[dependency-groups]
dev = ["pytest>=8"]
